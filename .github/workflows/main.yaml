name: Build My-Carton App

on:
  push:
    branches:
      - "*"
    tags:
      - "v*"
  pull_request:
    branches:
      - "*"

permissions:
  contents: write

jobs:
  run-script:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v1

      - name: Setup NuGet
        uses: nuget/setup-nuget@v1

      - name: Run Build Script
        shell: cmd
        run: call run.bat

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            ./artefacts
            ./deploy/installer
            ./deploy/client

  release:
    name: Release My-Carton
    runs-on: ubuntu-22.04
    needs: run-script
    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: ./release_files

      - name: Debug file structure
        run: |
          echo "=== RELEASE FILE STRUCTURE ==="
          find ./release_files

      - name: Prepare release files
        run: |
          mkdir -p release_upload
          find release_files -type f -exec cp {} release_upload/ \;

          echo "=== UPLOAD CONTENT ==="
          ls -R release_upload

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ github.ref_name }}"
          RELEASE_TITLE="My-Carton $TAG_NAME"

          echo "Creating release: $RELEASE_TITLE"

          FILES=$(find release_upload -type f)

          gh release create "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TITLE" \
            --generate-notes \
            $FILES